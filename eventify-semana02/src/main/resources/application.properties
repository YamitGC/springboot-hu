spring.application.name=eventify

# Conexión a base de datos H2 persistente (guardada en disco, no en memoria)
spring.datasource.url=jdbc:h2:file:./data/eventifydb;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate crea o actualiza las tablas automáticamente según las entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Consola web de H2, útil para inspeccionar los datos manualmente
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console