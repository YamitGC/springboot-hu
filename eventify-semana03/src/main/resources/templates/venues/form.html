<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Eventify — Lugar</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}"/>
</head>
<body>

<nav th:replace="~{fragments/layout :: nav}"></nav>

<main>
    <h1 th:text="${venue.id == null} ? 'Registrar nuevo lugar' : 'Editar lugar'">Lugar</h1>

    <form th:action="${venue.id == null} ? @{/admin/venues} : @{/admin/venues/__${venue.id}__/edit}"
          th:object="${venue}" method="post">

        <input type="hidden" th:if="${venue.id != null}" th:field="*{id}"/>

        <div class="field">
            <label for="nombre">Nombre</label>
            <input type="text" id="nombre" th:field="*{nombre}"/>
            <p class="error" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}">Error</p>
        </div>

        <div class="field">
            <label for="direccion">Dirección</label>
            <input type="text" id="direccion" th:field="*{direccion}"/>
            <p class="error" th:if="${#fields.hasErrors('direccion')}" th:errors="*{direccion}">Error</p>
        </div>

        <div class="field">
            <label for="capacidad">Capacidad</label>
            <input type="number" id="capacidad" th:field="*{capacidad}"/>
            <p class="error" th:if="${#fields.hasErrors('capacidad')}" th:errors="*{capacidad}">Error</p>
        </div>

        <button type="submit" class="btn" th:text="${venue.id == null} ? 'Guardar' : 'Actualizar'">Guardar</button>
        <a th:href="@{/admin/venues}">Cancelar</a>
    </form>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>

</body>
</html>
