spring.application.name=eventify

# Conexión a la base de datos PostgreSQL real
spring.datasource.url=jdbc:postgresql://localhost:5433/eventify
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=eventify
spring.datasource.password=eventify

# Hibernate crea o actualiza las tablas automáticamente según las entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Swagger solo documenta la API; las rutas /admin/** son la interfaz web
# y no son parte del contrato de la API.
springdoc.paths-to-match=/api/**