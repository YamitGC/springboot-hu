# Conexión a la base de datos de pruebas (H2 en memoria con modo PostgreSQL)
spring.datasource.url=jdbc:h2:mem:eventify_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# En pruebas el esquema lo crea Hibernate; Flyway queda apagado
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true