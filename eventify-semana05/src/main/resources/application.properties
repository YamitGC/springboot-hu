spring.application.name=eventify

# Conexión a la base de datos PostgreSQL real
spring.datasource.url=jdbc:postgresql://localhost:5433/eventify
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=eventify
spring.datasource.password=eventify

# --- Flyway: dueño del esquema ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# --- Hibernate: solo VALIDA que las entidades coincidan con las tablas ---
spring.jpa.hibernate.ddl-auto=validate

# --- Auditoría SQL y observabilidad ---
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Valores reales de los parámetros (Hibernate 6/7 usa la primera categoría;
# la segunda es la clásica que menciona la HU. Dejamos ambas).
logging.level.org.hibernate.orm.jdbc.bind=TRACE
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Swagger solo documenta la API; las rutas /admin/** son la interfaz web
# y no son parte del contrato de la API.
springdoc.paths-to-match=/api/**